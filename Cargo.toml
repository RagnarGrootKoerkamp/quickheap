[workspace]
members = [
    "quickheap",
    "quickheap-dev",
    "quickheap-dev/bench",
]
resolver = "3"
default-members = ["quickheap"]

[profile.bench]
debug = true

[profile.release]
debug = false
codegen-units = 1
lto = "fat"

[profile.profiling]
inherits = "release"
debug = true
strip = false
