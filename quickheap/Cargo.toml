[package]
name = "quickheap"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
readme = "../README.md"
repository = "https://github.com/RagnarGrootKoerkamp/quickheap"
keywords = ["priority-queue", "heap", "simd"]
categories = ["algorithms", "data-structures"]
authors = ["Ragnar Groot Koerkamp", "Marvin Williams", "Johannes Breitling"]
description = "A SIMD-accelerated priority queue"


[dependencies]
rand = "0.10.1"
wide = "1.2.0"
ensure_simd = "0.1.0"

[dev-dependencies]
fastrand = "2.3.0"

[[bench]]
name = "constant_size_increasing"
harness = false

[lib]
name = "quickheap"
crate-type = ["cdylib", "rlib"]

[features]
default = ["c"]
layer_stats = []
partition_stats = []
# C-ABI bindings (src/c.rs), used by the C++ bindings in cpp/.
c = []
