[package]
name = "quickheap"
version.workspace = true
edition.workspace = true

[dependencies]
rand = "0.10.1"
wide = "1.2.0"

[[bench]]
name = "constant_size_increasing"
harness = false

[lib]
name = "quickheap"
crate-type = ["cdylib", "rlib"]

[features]
default = ["c"]
layer_stats = []
partition_stats = []
# C-ABI bindings (src/c.rs), used by the C++ bindings in cpp/.
c = []
